[package]
name = "kata_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
env_logger = "0.11.10"
log = "0.4.32"
rust_lib_kata = { git = "https://github.com/fmeef/kata-rs.git" }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["full"] }
